<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HappyPretty 的第一个网站</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 50px 60px;
      border-radius: 20px;
      text-align: center;
      max-width: 560px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    h1 { font-size: 2.2em; margin-bottom: 15px; }
    p  { font-size: 1.1em; line-height: 1.8; opacity: 0.95; }
    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.25);
      padding: 8px 18px;
      border-radius: 999px;
      margin: 25px 0 5px;
      font-size: 0.9em;
    }
    footer {
      margin-top: 25px;
      font-size: 0.85em;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>👋 你好，我是 HappyPretty</h1>
    <p>这是我用 GitHub Pages 建的第一个网站。</p>
    <p>2026 年 9 月 26 日，我学会了 Git 和 GitHub。</p>
    <div class="badge">🚀 Powered by GitHub Pages</div>
    <footer>代码托管在 GitHub · 用 Git 管理版本</footer>
  </div>
</body>
</html>
